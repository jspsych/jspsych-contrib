<!DOCTYPE html>
<html>
  <head>
    <title>plugin-numpad example</title>
    <script src="https://unpkg.com/jspsych@8"></script>
    <script src="../dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8/css/jspsych.css" />
  </head>
  <body></body>
  <script>
    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    // simple numpad trial with preamble
    const basic = {
      type: jsPsychNumpad,
      preamble: "<p>Enter any number using the numpad below.</p>",
    };

    // pin trial, force user to enter exactly 4 digits
    const pin = {
      type: jsPsychNumpad,
      preamble: "<p><strong>Enter a 4-digit PIN.</strong></p>",
      min_digits: 4,
      max_digits: 4,
      error_message: () => "Please enter exactly 4 digits.",
    };

    // reverse layout with phone-like button texts at bottom, validated as an age
    const age = {
      type: jsPsychNumpad,
      preamble: "<p>How old are you?</p>",
      numpad_layout: [
        [9, 8, 7],
        [6, 5, 4],
        [3, 2, 1],
        ["delete", 0, "continue"],
      ],
      delete_button_text: "⌫",
      continue_button_text: "OK",
      max_digits: 3,
      validate_fn: (input) => Number(input) >= 18 && Number(input) <= 120,
      error_message: (input, reason) =>
        reason === "validate_fn"
          ? `${input} is not a valid age. Please enter an age between 18 and 120.`
          : "Please enter your age.",
    };

    // desktop-style numpad: merged 0, delete, and continue keys, plus decimal and negative
    const desktop = {
      type: jsPsychNumpad,
      preamble: "<p>Enter a temperature (can be negative or a decimal).</p>",
      numpad_layout: [
        ["negative", null, null, "delete"],
        [7, 8, 9, "delete"],
        [4, 5, 6, "continue"],
        [1, 2, 3, "continue"],
        [0, 0, "decimal", "continue"],
      ],
      continue_button_text: "Enter",
    };

    // money input with automatic thousands separators and a "00" key
    const money = {
      type: jsPsychNumpad,
      preamble: "<p>How much would you pay? (separators are added automatically)</p>",
      numpad_layout: [
        [1, 2, 3],
        [4, 5, 6],
        [7, 8, 9],
        ["00", 0, "decimal"],
        ["delete", "continue", "continue"],
      ],
      separate_pattern: "thousands",
      format_function: (input) => "$" + input,
    };

    // units shown in the preview, with a 10 second time limit
    const weight = {
      type: jsPsychNumpad,
      preamble: "<p>Estimate the weight. You have 10 seconds.</p>",
      format_function: (input) => input + " kg",
      trial_duration: 10000,
    };

    // european formatting with a manual separator key
    const european = {
      type: jsPsychNumpad,
      preamble: "<p>Enter a number using a manual separator key (1.234,5).</p>",
      numpad_layout: [
        [1, 2, 3],
        [4, 5, 6],
        [7, 8, 9],
        ["separator", 0, "decimal"],
        ["delete", "continue", "continue"],
      ],
      decimal_character: ",",
      separator_character: ".",
    };

    // indian numbering with lakh/crore grouping
    const lakhCrore = {
      type: jsPsychNumpad,
      preamble: "<p>Enter an amount in rupees (12,34,567).</p>",
      separate_pattern: "lakh_crore",
    };

    // no preview, keyboard disabled, empty responses allowed
    const noPreview = {
      type: jsPsychNumpad,
      preamble: "<p>Enter a number, or continue without one. (preview hidden, keyboard disabled)</p>",
      show_preview: false,
      allow_keyboard: false,
      min_digits: 0,
    };

    jsPsych.run([basic, pin, age, desktop, money, weight, european, lakhCrore, noPreview]);
  </script>
</html>
